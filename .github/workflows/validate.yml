name: Validate Humanio CEO

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Plugin doctor
        run: python3 scripts/humanio.py doctor
      - name: Test framework
        run: python3 -m unittest discover -s tests -v
      - name: Validate governed self-pilot
        run: python3 scripts/humanio.py validate pilots/humanio-ceo --strict
